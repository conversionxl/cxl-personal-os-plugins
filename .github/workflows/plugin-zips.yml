name: Plugin ZIPs

# Publishes personal-os.zip and explorer.zip to the "plugin-zips" release, so
# people who can't add the marketplace can upload one plugin at a time.
# Stable links:
#   https://github.com/conversionxl/cxl-personal-os-plugins/releases/download/plugin-zips/personal-os.zip
#   https://github.com/conversionxl/cxl-personal-os-plugins/releases/download/plugin-zips/explorer.zip

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'mods/**'
      - 'scripts/build-zips.sh'
      - '.github/workflows/plugin-zips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIPs
        run: bash scripts/build-zips.sh

      - name: Publish to the plugin-zips release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pos=$(jq -r .version plugins/personal-os/.claude-plugin/plugin.json)
          exp=$(jq -r .version mods/explorer/.claude-plugin/plugin.json)
          notes="Upload one of these in Settings -> Plugins if you can't add the marketplace.

          - personal-os.zip: personal-os $pos
          - explorer.zip: explorer $exp

          Built from ${GITHUB_SHA::7}. Don't use the repository's own Download ZIP button: it holds both plugins and fails the upload check."
          if ! gh release view plugin-zips >/dev/null 2>&1; then
            gh release create plugin-zips --title "Plugin ZIPs" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release edit plugin-zips --notes "$notes"
          fi
          gh release upload plugin-zips dist/personal-os.zip dist/explorer.zip --clobber
